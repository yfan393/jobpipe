# GitHub Actions workflow for the jobpipe feed repo (yfan393/jobpipe; see references/automation.md).
# Put it at .github/workflows/jobpipe.yml. The Claude workspace can't reach Greenhouse / Lever / Ashby /
# Workday / Oracle / Amazon / HN / dol.gov, but it can read raw.githubusercontent.com, so this repo does
# the fetching and the daily Claude run reads the results.
#
# Schedules (UTC; GitHub may start 5-20 minutes late):
#   daily   10:00  merge companies the last Claude run discovered, then collect every feed (~6:00 ET)
#   Sunday  08:30  registry check: verify every board, detect ATS behind career pages
#   monthly 3rd 07:00  DOL LCA sponsor list rebuilt from the newest quarterly file, registry grown from it
# Move the daily cron if the unified run's time changes; it should finish ~45 min before that run.
name: jobpipe

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "30 8 * * 0"
    - cron: "0 7 3 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        options: [collect, registry-check, sponsors]
        default: collect

permissions:
  contents: write

concurrency:
  group: jobpipe
  cancel-in-progress: false

jobs:
  jobpipe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '30 8 * * 0' && 'registry-check') || (github.event.schedule == '0 7 3 * *' && 'sponsors') || 'collect' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest test_jobpipe

      - name: Merge companies discovered by the daily Claude run
        if: env.JOB == 'collect' && hashFiles('registry_additions.csv') != ''
        run: |
          python jobpipe.py registry-add registry_additions.csv
          git rm -q --cached registry_additions.csv || true
          rm -f registry_additions.csv

      - name: Collect every machine-readable source
        if: env.JOB == 'collect'
        run: |
          mkdir -p data/latest
          python jobpipe.py collect --hours 72 --out data/latest/raw.json
          python jobpipe.py doctor > data/latest/doctor.txt || true

      - name: Registry check
        if: env.JOB == 'registry-check'
        run: |
          mkdir -p data
          python jobpipe.py registry-check > data/registry_report.json || true
          tail -c 3000 data/registry_report.json

      - name: DOL sponsor list and registry growth
        if: env.JOB == 'sponsors'
        continue-on-error: true   # dol.gov can be slow or refuse; last month's sponsors.json stays in place
        run: |
          pip install --quiet openpyxl
          mkdir -p /tmp/lca data
          python jobpipe.py sponsors-build --download /tmp/lca --out sponsors.json
          python jobpipe.py registry-grow --sponsors sponsors.json --candidates data/registry_candidates.csv | tee data/registry_grow.txt

      - name: Commit results
        run: |
          git config user.name "jobpipe-bot"
          git config user.email "jobpipe-bot@users.noreply.github.com"
          git add -A data companies.csv
          [ -f sponsors.json ] && git add sponsors.json
          git add -u
          git diff --cached --quiet || git commit -m "jobpipe ${JOB} $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
